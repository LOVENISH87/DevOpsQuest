version: '3.8'

# Networking structure for microservices
services:
  web_frontend:
    image: nginx:alpine
    networks:
      - microservice_net
  
  api_backend:
    image: node:18-alpine
    command: tail -f /dev/null
    networks:
      - microservice_net

# Dedicated custom bridge network enables strict DNS resolution by service name
networks:
  microservice_net:
    driver: bridge

version : "3.0"
services : 
    wordpress :
        image : wordpress:latest
        environment : 
          WORDPRESS_DB_HOST: database
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: batman
          WORDPRESS_DB_NAME: wordpress

        depends_on:
          -database
        
        ports :
          - 8080:80
        networks :
          ipv4_address : 10.0.0.2
    
    
    database : 
      image : mariadb

      environment:
        MARIADB_ROOT_PASSWORD : batman
        MARIADB_DATABASE : wordpress
      ports : 
        3306:3306
      volumes :
        - db_data:/var/lib/mariadb
      networks :
        ipv4_address : 10.0.0.3
        
networks :
  batman :
    ipam :
      driver : default
      config : 
        - subnet : "10.0.0.0/24"
      
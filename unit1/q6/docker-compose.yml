version: '3.8'

# Demonstrates persistent storage using Docker volumes
services:
  web_server:
    image: nginx:alpine
    container_name: persistent_nginx
    ports:
      - "8080:80"
    # Mount the named volume to the Nginx HTML directory
    volumes:
      - website_data:/usr/share/nginx/html

volumes:
  # Defines a managed volume that persists even if the container is deleted
  website_data:

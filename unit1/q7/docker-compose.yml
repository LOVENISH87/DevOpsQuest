version: '3.8'

# Demonstrates internal DNS resolution between containers via a custom bridge network
services:
  frontend:
    image: nginx:alpine
    container_name: app_frontend
    ports:
      - "8080:80"
    networks:
      - backend_bridge

  backend_api:
    image: node:18-alpine
    container_name: app_backend
    # Simple dummy process
    command: sh -c "echo 'Backend API is ready' && tail -f /dev/null"
    networks:
      - backend_bridge

networks:
  backend_bridge:
    driver: bridge

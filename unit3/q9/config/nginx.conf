events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Route matching /user/ logic -> Users API
        location /user/ {
            proxy_pass URl;
            proxy_set_header Host $host;
        }

        # Route matching /order/ logic -> Order API
        location /order/ {
            proxy_pass URl;
            proxy_set_header Host $host;
        }
    }
}

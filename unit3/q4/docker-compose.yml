version: '3.8'

# Properly protecting Database Passwords using Docker Secrets securely
services:
  database:
    image: mysql:8.0
    environment:
      # Instruct MySQL to look at the secret file natively
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
    secrets:
      - database_root_password

secrets:
  database_root_password:
    # Resolves to a physical file residing safely on the host
    file: ./secrets/db_password.txt

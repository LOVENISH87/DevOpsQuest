version: '3.8'

# Monolithic to Microservices Transition Architecture
services:
  frontend_ui:
    image: nginx:alpine
    ports:
      - "80:80"
      
  backend_api:
    image: node:18-alpine
    command: node server.js
    
  database_tier:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password
      MYSQL_DATABASE: shop_db

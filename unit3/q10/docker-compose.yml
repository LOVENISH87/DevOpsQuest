version: '3.8'

# Guaranteeing database integrity for Multi-Container deployments via Stateful volumes
services:
  production_database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password
    volumes:
      # Persists internal database state onto the Host machine
      - persistent_db_data:/var/lib/mysql

volumes:
  persistent_db_data:
